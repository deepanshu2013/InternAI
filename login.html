<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | InternAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="login.js"></script>
  <!-- <script src="lang.js"></script> -->
</head>
<body class="bg-gradient-to-br from-black via-gray-900 to-black min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-gray-900/80 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-gray-700">
    <!-- Header -->
    <h2 class="text-3xl font-bold text-center text-white mb-6">Welcome Back</h2>
    <p class="text-gray-400 text-center mb-8">Login to <span class="text-pink-500 font-semibold">InternAI</span> and explore internships tailored for you.</p>
    
    <!-- Login Form -->
    <form class="space-y-5">
      <div>
        <label for="email" class="block text-gray-300 mb-2">Email</label>
        <input type="email" id="email" placeholder="Enter your email" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      
      <div>
        <label for="password" class="block text-gray-300 mb-2">Password</label>
        <input type="password" id="password" placeholder="Enter your password" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
      </div>

      <!-- Remember Me + Forgot -->
      <div class="flex items-center justify-between text-sm text-gray-400">
        <label class="flex items-center gap-2">
          <input type="checkbox" class="accent-pink-600">
          Remember me
        </label>
        <a href="#" class="text-pink-500 hover:underline">Forgot Password?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="w-full py-3 mt-4 bg-gradient-to-r from-pink-600 to-indigo-600 text-white font-semibold rounded-lg shadow-lg hover:scale-105 transition transform">
        Login
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <hr class="flex-grow border-gray-600">
      <span class="mx-3 text-gray-400">or</span>
      <hr class="flex-grow border-gray-600">
    </div>

    <!-- Social Login -->
    <div class="flex justify-center space-x-4">
      <button class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition">Google</button>
      <button class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition">Microsoft</button>
    </div>

    <!-- Footer -->
    <p class="mt-8 text-center text-gray-400">Don’t have an account?
      <a href="signup.html" class="text-pink-500 hover:underline">Sign Up</a>
    </p>
  </div>

  <!-- JS -->
  <script src="assets/js/login.js"></script>
</body>
</html>
