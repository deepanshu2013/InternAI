<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | InternAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="signup.js"></script>
  <!-- <script src="lang.js"></script> -->
</head>
<body class="bg-gradient-to-br from-black via-gray-900 to-black min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-gray-900/80 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-gray-700">
    <!-- Header -->
    <h2 class="text-3xl font-bold text-center text-white mb-6" data-translate>Create an Account</h2>
    <p class="text-gray-400 text-center mb-8">Join <span class="text-pink-500 font-semibold" data-translate>InternAI</span> and find the best internships for you.</p>
    
    <!-- Signup Form -->
    <form class="space-y-5">
      <div>
        <label for="name" class="block text-gray-300 mb-2" data-translate>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
      </div>
      
      <div>
        <label for="email" class="block text-gray-300 mb-2"data-translate>Email</label>
        <input type="email" id="email" placeholder="Enter your email" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      
      <div>
        <label for="password" class="block text-gray-300 mb-2"data-translate>Password</label>
        <input type="password" id="password" placeholder="Enter your password" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
      </div>
      
      <div>
        <label for="confirm" class="block text-gray-300 mb-2"data-translate>Confirm Password</label>
        <input type="password" id="confirm" placeholder="Re-enter your password" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Signup Button -->
      <button type="submit" class="w-full py-3 mt-4 bg-gradient-to-r from-pink-600 to-indigo-600 text-white font-semibold rounded-lg shadow-lg hover:scale-105 transition transform"data-translate>
        Sign Up
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <hr class="flex-grow border-gray-600">
      <span class="mx-3 text-gray-400">or</span>
      <hr class="flex-grow border-gray-600">
    </div>

    <!-- Social Signup -->
    <div class="flex justify-center space-x-4">
      <button class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition">Google</button>
      <button class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition">Microsoft</button>
    </div>

    <!-- Footer -->
    <p class="mt-8 text-center text-gray-400">Already have an account?
      <a href="login.html" class="text-pink-500 hover:underline">Login</a>
    </p>
  </div>

</body>
</html>
