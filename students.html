<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | InternAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="students.js"></script>
  <!-- <script src="lang.js"></script> -->
</head>
<body class="bg-gradient-to-br from-black via-gray-900 to-black min-h-screen text-gray-100 flex flex-col items-center p-6">

  <!-- Header -->
  <header class="w-full max-w-4xl flex justify-between items-center mb-10 
    bg-white/10 backdrop-blur-lg border border-white/20 
    p-4 rounded-2xl shadow-2xl">
    
    <h1 class="text-3xl md:text-4xl font-bold">🎓 Student Profile</h1>
    
    <a href="resume.html" 
      class="px-6 py-2 bg-white/10 backdrop-blur-md border border-white/20 
      hover:bg-pink-500/80 rounded-xl shadow-lg font-semibold 
      transition transform hover:scale-105">
      Build Resume
    </a>
  </header>

  <!-- Intro Text -->
  <p class="text-gray-400 mb-10 text-center max-w-2xl">
    Fill in your details so we can recommend the best internships tailored to your skills and education.
  </p>

  <!-- Student Info Form -->
  <form id="studentForm" 
    class="bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-2xl 
    w-full max-w-3xl space-y-4 border border-white/20">

    <!-- Personal Info -->
    <div>
      <label class="block mb-1 text-gray-300">Full Name <span class="text-red-500">*</span></label>
      <input type="text" id="fullName" required placeholder="Your full name" 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
    </div>

    <div>
      <label class="block mb-1 text-gray-300">Email <span class="text-red-500">*</span></label>
      <input type="email" id="email" required placeholder="you@example.com" 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
    </div>

    <div>
      <label class="block mb-1 text-gray-300">Location / City</label>
      <input type="text" id="location" placeholder="City, State" 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
    </div>

    <div>
      <label class="block mb-1 text-gray-300">Branch / Specialization</label>
      <input type="text" id="branch" placeholder="Computer Science, IT, etc." 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
    </div>

    <!-- Education Info -->
    <div>
      <label class="block mb-1 text-gray-300">Graduated? <span class="text-red-500">*</span></label>
      <select id="graduated" required 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100">
        <option value="">Select</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <div id="graduationDetails" class="space-y-2 hidden">
      <div>
        <label class="block mb-1 text-gray-300">Graduation Year</label>
        <input type="number" id="gradYear" placeholder="2025" 
          class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
          focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
      </div>
      <div>
        <label class="block mb-1 text-gray-300">Graduation Percent / CGPA</label>
        <input type="number" id="gradPercent" placeholder="85" 
          class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
          focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
      </div>
    </div>

    <div>
      <label class="block mb-1 text-gray-300">Current Year / Studying Year</label>
      <input type="number" id="currentYear" placeholder="3" 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
    </div>

    <!-- Skills and Experience -->
    <div>
      <label class="block mb-1 text-gray-300">Skills (comma separated) <span class="text-red-500">*</span></label>
      <input type="text" id="skills" required placeholder="HTML, CSS, JavaScript" 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
    </div>

    <div>
      <label class="block mb-1 text-gray-300">Internship / Project Experience</label>
      <textarea id="experience" rows="3" placeholder="Describe your experience" 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400"></textarea>
    </div>

    <div>
      <label class="block mb-1 text-gray-300">LinkedIn / Portfolio Link</label>
      <input type="url" id="portfolio" placeholder="https://linkedin.com/in/username" 
        class="w-full px-4 py-2 rounded-lg bg-gray-900/40 border border-white/20 
        focus:outline-none focus:ring-2 focus:ring-pink-500 text-gray-100 placeholder-gray-400">
    </div>

    <!-- Save Profile Button -->
    <button type="submit" 
      class="w-full py-3 bg-white/10 backdrop-blur-md border border-white/20 
      hover:bg-pink-600/80 rounded-2xl font-semibold shadow-xl 
      transition transform hover:scale-105">
      Save Profile
    </button>
  </form>

  <!-- Include JS at the bottom -->
  <script src="students.js"></script>
</body>
</html>
