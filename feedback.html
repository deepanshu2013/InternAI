<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback | InternAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-gray-900/70 p-8 rounded-2xl shadow-lg flex flex-col items-center">
    <!-- Header -->
    <h1 class="text-3xl font-bold text-pink-500 mb-2 text-center">We Value Your Feedback!</h1>
    <p class="text-gray-300 mb-6 text-center">Please share your thoughts about the application process.</p>

    <!-- Feedback Form -->
    <form id="feedbackForm" class="w-full flex flex-col space-y-4">
      <input type="text" id="name" placeholder="Your Name" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700" required>
      <input type="email" id="email" placeholder="Your Email" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700" required>
      <textarea id="feedback" rows="5" placeholder="Your Feedback" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700" required></textarea>

      <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-600 to-indigo-600 text-white font-semibold rounded-lg shadow-lg hover:scale-105 transition transform">
        Submit Feedback
      </button>
    </form>

    <!-- Back Button -->
    <button id="backBtn" class="mt-6 px-6 py-3 bg-gray-800 hover:bg-gray-700 rounded-lg font-semibold transition">
      ← Back to InternAI
    </button>
  </div>

  <script>
    const feedbackForm = document.getElementById("feedbackForm");
    const backBtn = document.getElementById("backBtn");

    // Form submission
    feedbackForm.addEventListener("submit", (e) => {
      e.preventDefault();
      alert("Thank you for your feedback! 🙏");
      feedbackForm.reset();
    });

    // Back button
    backBtn.addEventListener("click", () => {
      window.location.href = "main.html";
    });
  </script>

</body>
</html>
