<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Submitted | InternAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #34D399; /* green */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      position: relative;
      animation: pop 0.6s ease-out;
    }

    .check {
      width: 50px;
      height: 25px;
      border-left: 5px solid white;
      border-bottom: 5px solid white;
      transform: rotate(-45deg);
      opacity: 0;
      position: absolute;
      animation: draw 0.5s 0.3s forwards;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes draw {
      0% { opacity: 0; transform: rotate(-45deg) scale(0); }
      100% { opacity: 1; transform: rotate(-45deg) scale(1); }
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="flex flex-col items-center text-center">
    <!-- Circle with checkmark -->
    <div class="circle bg-green-500/70">
      <div class="check"></div>
    </div>

    <!-- Message -->
    <h1 class="text-3xl font-bold text-green-400 mb-4">Application Submitted!</h1>
    <p class="text-gray-300 mb-8 max-w-md">Thank you for applying. Your application has been successfully submitted.</p>

    <!-- Feedback Button -->
    <button id="feedbackBtn" class="px-6 py-3 bg-pink-600 hover:bg-pink-500 rounded-lg font-semibold shadow-lg transition transform hover:scale-105 mb-4">
      Give Feedback
    </button>

    <!-- Back to Recommendations -->
    <button id="backBtn" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 rounded-lg font-semibold transition">
      ← Back to Recommendations
    </button>
  </div>

  <script>
    const feedbackBtn = document.getElementById("feedbackBtn");
    const backBtn = document.getElementById("backBtn");

    feedbackBtn.addEventListener("click", () => {
      window.location.href = "feedback.html";
    });

    backBtn.addEventListener("click", () => {
      window.location.href = "recommendations.html";
    });
  </script>

</body>
</html>
