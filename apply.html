<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply Now | InternAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="apply.js" defer></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-6">

  <!-- Header -->
  <header class="w-full max-w-3xl mb-8 text-center">
    <h1 class="text-3xl font-bold text-pink-500">Apply for Internship</h1>
    <p class="text-gray-400 mt-2">Fill out the form below to apply for your selected internship.</p>
  </header>

  <!-- Internship Info -->
  <div class="w-full max-w-3xl bg-gray-900/70 p-6 rounded-2xl shadow-lg mb-6">
    <h2 class="text-2xl font-semibold mb-2" id="internshipTitle">Internship Title</h2>
    <p class="text-gray-300 mb-2" id="companyName">Company Name</p>
  </div>

  <!-- Application Form -->
  <form id="applyForm" class="w-full max-w-3xl bg-gray-900/70 p-8 rounded-2xl shadow-lg space-y-4">
    <input type="text" id="fullName" placeholder="Full Name" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700" required>
    <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700" required>
    <input type="text" id="phone" placeholder="Phone Number" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700">
    <textarea id="skills" rows="3" placeholder="Your Skills / Experience" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700"></textarea>
    <textarea id="motivation" rows="3" placeholder="Why do you want this internship?" class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700"></textarea>
    
    
    <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-600 to-indigo-600 text-white font-semibold rounded-lg shadow-lg hover:scale-105 transition transform">
      Submit Application
    </button>
  </form>

  <!-- Back Button -->
  <button id="backBtn" class="mt-6 px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 font-semibold">
    ← Back to Recommendations
  </button>

</body>
</html>
